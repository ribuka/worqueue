[project]
name = "worqueue"
version = "0.1.0"
description = "プレイングマネージャー向けの、優先順位の可視化とタスク管理を統合したアプリ"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "filelock>=4.3.1",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
wq = "worqueue.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worqueue"]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "playwright==1.65.2",
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",
    "ruff==0.16.7",
    "ty==0.0.109",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]
# E2E tests run only with `-m e2e` (a later -m replaces this one).
addopts = ["-m", "not e2e", "--browser-channel", "chrome"]
markers = ["e2e: drives the Web UI in a browser (playwright); run with -m e2e"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D", "ANN", "C901", "PLR0912", "PLR0915", "RUF100", "ARG", "SIM", "C4", "RET", "PIE"]

[tool.ruff.lint.per-file-ignores]
# pytest injects fixtures as arguments, used or not.
"tests/**" = ["ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"
