[project]
name = "worqueue"
version = "0.1.0"
description = "プレイングマネージャー向けの、優先順位の可視化とタスク管理を統合したアプリ"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "filelock>=4.3.1",
    "pyyaml>=6.0.4",
]

[project.scripts]
wq = "worqueue.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worqueue"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "D", "ANN", "C901", "PLR0912", "PLR0915", "RUF100", "ARG", "SIM", "C4", "RET", "PIE"]

[tool.ruff.lint.per-file-ignores]
# pytest injects fixtures as arguments, used or not.
"tests/**" = ["ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"
